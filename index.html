<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clock</title>
  <link href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400&family=DM+Sans:wght@200;300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --surface: #f9f8f7;
      --ink: #1c1917;
      --ink-mid: #57534e;
      --ink-muted: #a8a29e;
      --accent: #B59259;
      --border: rgba(0,0,0,0.07);
      --radius: 4px;
    }

    html, body {
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .widget {
      background: var(--surface);
      border: none;
      border-radius: var(--radius);
      width: 100%;
      padding: 22px 24px 20px;
      position: relative;
    }

    /* Top row: day of week left, date right */
    .top-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }

    .day-of-week {
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.20em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .date-str {
      font-family: 'Jost', sans-serif;
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.10em;
      color: var(--ink-muted);
    }

    /* Hairline */
    .hairline {
      width: 100%;
      height: 1px;
      background: var(--border);
      margin-bottom: 10px;
    }

    /* Time */
    .time {
      font-family: 'DM Sans', sans-serif;
      font-size: 75px;
      font-weight: 500;
      color: var(--ink);
      letter-spacing: 0.015em;
      line-height: 1;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .time .colon {
      display: inline-block;
      animation: blink 1s step-start infinite;
      color: var(--accent);
      font-size: 52px;
      margin: 0 2px;
      font-weight: 300;
      line-height: 1;
      position: relative;
      top: -5px;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.1; }
    }
  </style>
</head>
<body>
  <div class="widget">
    <div class="time">
      <span id="hh"></span><span class="colon">:</span><span id="mm"></span>
    </div>
    <div style="margin-top: 10px;"></div>
    <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom: 0;">
      <div class="day-of-week" id="day-of-week"></div>
      <div style="width:1px; height:12px; background:var(--ink-muted); opacity:0.4;"></div>
      <div class="date-str" id="date-str"></div>
    </div>
  </div>

  <script>
    const DAYS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function tick() {
      const now = new Date();
      document.getElementById('hh').textContent = pad(now.getHours());
      document.getElementById('mm').textContent = pad(now.getMinutes());
      document.getElementById('day-of-week').textContent = DAYS[now.getDay()];
      document.getElementById('date-str').textContent =
        `${now.getDate()} ${MONTHS[now.getMonth()]} ${now.getFullYear()}`;
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
